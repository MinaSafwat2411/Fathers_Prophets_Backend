openapi: "3.0.0"
info:
  title: "Fathers Prophets API"
  version: "1.0.0"
  description: "API documentation for the Fathers Prophets backend"

servers:
  - url: http://localhost:8080
    description: "Local server"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
    
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
          
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        email:
          type: string

paths:
  /auth/login:
    post:
      summary: "Login a user"
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: "Successful login"
          
  /auth/register:
    post:
      summary: "Register a new user"
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: "Successful registration"

  /users:
    get:
      summary: "Get all users"
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "List of users"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                
  /classes:
    get:
      summary: "Get all classes"
      tags:
        - Classes
      responses:
        '200':
          description: "List of classes"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
